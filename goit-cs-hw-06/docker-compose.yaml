services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy
    init: true

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo_data: